services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todo}
    ports:
      - "5432:5432"
    volumes:
      - todo-data:/var/lib/postgresql/data
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/todo
      DB_USER: todo
      DB_PASSWORD: ${DB_PASSWORD:-todo}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  todo-data: